name: Build and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: the site's change log is built from it
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate data
        run: python3 scripts/build.py
      - name: Summarise data changes
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${{ github.base_ref }}:data/rules.csv" > /tmp/base.csv
          { echo "## Changes to the data"; echo; python3 scripts/rules_diff.py /tmp/base.csv data/rules.csv; } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the search framework
        run: python3 scripts/check_search.py
      - name: Check scouting candidates
        run: python3 scripts/check_candidates.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build site
        run: python3 scripts/render.py
      - name: Check links and pages
        run: python3 scripts/check_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
